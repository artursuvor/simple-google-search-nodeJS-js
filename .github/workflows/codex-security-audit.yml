name: Temporary dependency security audit
on:
  push:
    branches: [codex/security-audit-2026-10-30]
    paths: [.github/workflows/codex-security-audit.yml]
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      npm_config_ignore_scripts: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Audit before changes
        run: npm audit --json > /tmp/audit-before.json || test $? -eq 1
      - name: Apply compatible fixes without install scripts
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund > /tmp/audit-fix.txt 2>&1 || test $? -eq 1
      - name: Audit after changes
        run: |
          npm audit --json > /tmp/audit-after.json || test $? -eq 1
          node - <<'NODE'
          const fs = require('fs');
          for (const phase of ['before', 'after']) {
            const report = JSON.parse(fs.readFileSync('/tmp/audit-' + phase + '.json', 'utf8'));
            console.log('AUDIT_' + phase.toUpperCase(), JSON.stringify(report.metadata || report.error));
            for (const [name, v] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({phase, name, severity: v.severity, range: v.range, fixAvailable: v.fixAvailable, advisories: v.via.filter(x => typeof x === 'object').map(x => ({title:x.title, url:x.url, range:x.range}))}));
            }
          }
          NODE
      - name: Validate install and tests
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test -- --runInBand --passWithNoTests
      - name: Commit compatible lockfile fixes
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "fix: update vulnerable dependency versions"
            git push origin HEAD:codex/security-audit-2026-10-30
          fi
